language: en-US
tone_instructions: |
  Be direct, technical, brief. No praise, emojis, headings, or collapsible menus.
  Start each comment with one prefix:
  - suggestion: optional improvement;
  - important: must-fix/high-impact risk;
  - critical: blocking correctness/security/data-loss.
reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  collapse_walkthrough: true
  # Reduce noisy status/details sections.
  request_changes_workflow: false
  review_status: false
  review_details: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
    ignore_usernames:
      - "copy-pr-bot[bot]"
      - "dependabot[bot]"
      - "github-actions[bot]"
  tools:
    gitleaks:
      enabled: false
    markdownlint:
      enabled: false
    shellcheck:
      enabled: false
  # Keep Autofix available, but disable the other finishing touch actions.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks: []
  path_instructions:
    - path: "ast_canopy/**/*"
      instructions: |
        Focus on Clang AST extraction correctness, CUDA execution-space filtering, template specialization,
        declaration identity, type and ABI fidelity, and pybind11 ownership and lifetime safety. Check CUDA header
        discovery and LLVM/CUDA version compatibility, and require regression coverage for parser behavior changes.
        Avoid style-only comments already covered by pre-commit.
    - path: "numbast/**/*"
      instructions: |
        Focus on Numba typing and lowering correctness, overload resolution, C++ ABI and data layout, generated
        shim signatures, argument intents, and consistency between static and dynamic bindings. Check shared
        configuration and CLI compatibility, backend isolation, and standalone generated-module dependencies.
        Check that public behavior changes have corresponding tests and documentation. Avoid style-only comments
        already covered by pre-commit.
    - path: "numbast_extensions/**/*"
      instructions: |
        Focus on CUDA library binding correctness, numeric conversions and precision, operator semantics,
        supported CUDA/Numba versions, and GPU test coverage. Preserve the documented demonstration scope of these
        extensions and avoid introducing dependencies on removed fp16 or cuRAND extensions.
    - path: "conda/**/*"
      instructions: |
        Focus on split-package dependency consistency, Python/CUDA/LLVM version constraints, build and runtime
        requirements, and package contents. Check that conda requirements remain compatible with Python package
        metadata and that ast_canopy native libraries and header shims are shipped correctly.
    - path: "**/pyproject.toml"
      instructions: |
        Focus on Python version requirements, dependency and version pins, build backends, Git-derived versions,
        entry points, and wheel and sdist contents. Check compatibility among numbast, ast_canopy, and
        numbast_extensions and preserve the runtime independence of generated static bindings.
    - path: "ci/**/*"
      instructions: |
        For CI and build scripts, focus on matrix correctness, the GPU-versus-CPU job split, targeted build and test
        behavior, cache and artifact handling, environment setup, clear failure modes, and avoiding unnecessary
        expensive jobs.
    - path: ".github/**/*"
      instructions: |
        For GitHub workflows and repository automation, focus on least-privilege permissions, event triggers, matrix
        generation, status and check behavior, security boundaries, and avoiding unnecessary CI fanout.
knowledge_base:
  opt_out: false
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "ast_canopy/README.md"
      - "numbast/README.md"
      - "numbast_extensions/README.md"
      - "numbast/src/numbast/experimental/mlir/README.md"
      - "docs/source/ast_canopy_overview.rst"
      - "docs/source/supported_declarations.rst"
      - "docs/source/argument_intents.rst"
      - "docs/source/static.rst"
      - "docs/source/dynamic.rst"
      - "docs/source/numba_cuda_mlir.rst"
